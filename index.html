<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema Colaborativo Oficial — MONUPE II | Distrito 01-03</title>
  <meta name="theme-color" content="#002247" />
  <style>
    :root {
      --prussian: #002247;
      --dusk: #005288;
      --azure: #007FF1;
      --aqua: #00CBFF;
      --frosted: #A7EBFF;
      --surface-bg: #eef7fc;
      --card-bg: #ffffff;
      --text-main: #002247;
      --text-muted: #3b5978;
      --border-soft: #cde6f5;
      --present-voting: #00668c;
      --absent-red: #c83e4d;
      --sync-green: #16a34a;
      --sync-red: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    }

    body {
      background-color: var(--surface-bg);
      color: var(--text-main);
      padding-bottom: 4.5rem;
    }

    /* ================= BARRA SUPERIOR Y BOTÓN ROJO/VERDE ================= */
    .top-utility-bar {
      background: #001833;
      color: var(--frosted);
      padding: 0.6rem 1.4rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.8rem;
      border-bottom: 1px solid rgba(167, 235, 255, 0.25);
      position: sticky;
      top: 0;
      z-index: 500;
    }

    .status-indicators {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      flex-wrap: wrap;
    }

    .room-pill {
      background: rgba(0, 127, 241, 0.28);
      border: 1px solid var(--aqua);
      color: white;
      padding: 0.28rem 0.75rem;
      border-radius: 6px;
      font-weight: 800;
      letter-spacing: 0.6px;
      cursor: pointer;
    }

    .sync-status-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.76rem;
      border: none;
      cursor: pointer;
      color: white;
      background: var(--sync-red);
      transition: background 0.3s ease;
    }

    .sync-status-btn.synced { background: var(--sync-green); }

    .sync-status-btn .led {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ffffff;
      display: inline-block;
    }

    .live-toast {
      background: var(--aqua);
      color: var(--prussian);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.76rem;
      display: none;
    }

    .utility-actions {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    /* ================= RECUADRO DINÁMICO DE DIRECTORES (CRECE HASTA 6) ================= */
    .mesa-presence-bar {
      background: #002247;
      border-bottom: 2px solid var(--azure);
      padding: 0.65rem 1.4rem;
      color: white;
    }

    .mesa-presence-inner {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .presence-left {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .presence-label {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--frosted);
    }

    .directors-list-dynamic {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      align-items: stretch;
    }

    .director-chip {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9px;
      padding: 0.38rem 0.75rem;
      border-left: 5px solid var(--aqua);
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 140px;
      position: relative;
    }

    .director-chip-name {
      font-size: 0.82rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .director-chip-role {
      font-size: 0.69rem;
      font-weight: 600;
      color: var(--frosted);
      margin-top: 0.1rem;
    }

    .remove-manual-dir {
      background: none;
      border: none;
      color: #ff8fa3;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      margin-left: 0.35rem;
    }

    /* ================= CRONÓMETROS MAGEAC Y COLA DE ORADORES ================= */
    .timers-wrapper {
      background: linear-gradient(180deg, #001d3d 0%, #002b59 100%);
      color: white;
      padding: 0.95rem 1.4rem 1.25rem;
      border-bottom: 3px solid var(--azure);
    }

    .timers-header {
      max-width: 1440px;
      margin: 0 auto 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .timers-header-title {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--frosted);
    }

    .timers-grid {
      max-width: 1440px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(430px, 1fr));
      gap: 1rem;
      align-items: start;
    }

    @media (max-width: 500px) { .timers-grid { grid-template-columns: 1fr; } }

    .mageac-card {
      background: #00152e;
      border: 1.5px solid var(--dusk);
      border-radius: 12px;
      padding: 0.9rem 1.05rem;
    }

    .mageac-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
      margin-bottom: 0.65rem;
    }

    .mageac-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--aqua);
      text-transform: uppercase;
    }

    .preset-pills { display: flex; gap: 0.28rem; flex-wrap: wrap; }

    .pill-btn {
      background: rgba(0, 82, 136, 0.6);
      color: var(--frosted);
      border: 1px solid rgba(167, 235, 255, 0.3);
      padding: 0.2rem 0.45rem;
      border-radius: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }

    .pill-btn:hover { background: var(--azure); color: white; }

    .mageac-middle {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 0.6rem;
      align-items: center;
      margin-bottom: 0.7rem;
    }

    .mageac-select {
      background: #001024;
      color: white;
      border: 1px solid var(--dusk);
      padding: 0.45rem 0.6rem;
      border-radius: 7px;
      font-size: 0.82rem;
      width: 100%;
    }

    .custom-time-box {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      background: #001024;
      border: 1px solid var(--dusk);
      padding: 0.28rem 0.45rem;
      border-radius: 7px;
      font-size: 0.72rem;
      color: var(--frosted);
    }

    .custom-time-box input {
      width: 40px;
      background: var(--prussian);
      border: 1px solid var(--azure);
      color: white;
      text-align: center;
      border-radius: 4px;
      padding: 0.18rem;
      font-weight: 700;
    }

    .mageac-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .digital-clock {
      font-size: 2.25rem;
      font-weight: 800;
      color: var(--aqua);
      font-variant-numeric: tabular-nums;
    }

    .clock-actions { display: flex; align-items: center; gap: 0.4rem; }

    /* ================= COLA INTERACTIVA DE ORADORES DEBAJO DEL CRONÓMETRO ================= */
    .speakers-queue-panel {
      margin-top: 0.85rem;
      padding-top: 0.75rem;
      border-top: 1px dashed rgba(167, 235, 255, 0.3);
    }

    .queue-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .queue-subtitle {
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--frosted);
      letter-spacing: 0.5px;
    }

    .speaker-queue-list {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      max-height: 270px;
      overflow-y: auto;
      padding-right: 0.2rem;
    }

    .speaker-turn-card {
      background: #002247;
      border: 1px solid var(--dusk);
      border-radius: 9px;
      padding: 0.52rem 0.7rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .speaker-turn-card.active-turn {
      background: linear-gradient(90deg, #00356b 0%, #002247 100%);
      border: 1.5px solid var(--aqua);
    }

    .turn-info {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 175px;
      flex: 1;
    }

    .turn-badge {
      background: var(--dusk);
      color: white;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
    }

    .speaker-turn-card.active-turn .turn-badge {
      background: var(--aqua);
      color: var(--prussian);
    }

    .turn-score-actions {
      display: flex;
      align-items: center;
      gap: 0.38rem;
      flex-wrap: wrap;
    }

    .speech-grade-input {
      width: 54px;
      background: #001024;
      border: 1.5px solid var(--aqua);
      color: white;
      border-radius: 6px;
      padding: 0.28rem 0.25rem;
      text-align: center;
      font-weight: 800;
      font-size: 0.85rem;
    }

    .speech-session-ended-banner {
      background: linear-gradient(90deg, #005288 0%, #007FF1 100%);
      border: 1.5px solid var(--aqua);
      color: #ffffff;
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      font-weight: 800;
      font-size: 0.82rem;
      letter-spacing: 0.6px;
    }

    /* ================= BOTONES GENERALES ================= */
    .btn {
      border: none;
      border-radius: 7px;
      padding: 0.46rem 0.82rem;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn:active { transform: scale(0.98); }
    .btn-prussian { background: var(--prussian); color: white; }
    .btn-prussian:hover { background: var(--dusk); }
    .btn-dusk { background: var(--dusk); color: white; }
    .btn-azure { background: var(--azure); color: white; }
    .btn-azure:hover { background: #006ad1; }
    .btn-aqua { background: var(--aqua); color: var(--prussian); }
    .btn-frosted { background: var(--frosted); color: var(--prussian); }
    .btn-outline-light { background: rgba(255,255,255,0.08); color: var(--frosted); border: 1px solid rgba(167,235,255,0.35); }
    .btn-outline-light:hover { background: rgba(255,255,255,0.16); }
    .btn-danger { background: var(--absent-red); color: white; }
    .btn-round { width: 30px; height: 30px; padding: 0; border-radius: 50%; }

    /* ================= CONTENEDOR PRINCIPAL Y PESTAÑAS ================= */
    .main-container {
      max-width: 1440px;
      margin: 1.15rem auto;
      padding: 0 1.25rem;
    }

    .tabs-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      background: white;
      padding: 0.5rem;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
      margin-bottom: 1.15rem;
    }

    @media (max-width: 850px) { .tabs-bar { grid-template-columns: repeat(2, 1fr); } }

    .tab-btn {
      background: #f4faff;
      color: var(--dusk);
      border: 1px solid var(--border-soft);
      padding: 0.68rem 0.85rem;
      border-radius: 9px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn:hover { background: var(--frosted); color: var(--prussian); }
    .tab-btn.active { background: var(--prussian); color: white; border-color: var(--prussian); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ================= TARJETAS Y FORMULARIOS ================= */
    .two-col-grid {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 1.15rem;
      margin-bottom: 1.15rem;
    }

    @media (max-width: 960px) { .two-col-grid { grid-template-columns: 1fr; } }

    .panel-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.2rem 1.35rem;
      border: 1px solid var(--border-soft);
      border-top: 4px solid var(--azure);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.9rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--surface-bg);
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .panel-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--prussian);
      text-transform: uppercase;
    }

    .district-tag {
      background: var(--frosted);
      color: var(--prussian);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
    }

    @media
